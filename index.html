<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050a07">
  <title>HACKER PRANK 💚</title>
  <style>
    :root { --green: #39ff88; --dark: #050a07; --muted: #9ab9a5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #eaffef; background: var(--dark);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
    }
    #matrix { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .42; pointer-events: none; }
    .card {
      position: relative; z-index: 1; width: min(100%, 520px); padding: 30px 22px;
      text-align: center; border: 1px solid rgba(57,255,136,.55);
      border-radius: 22px; background: rgba(4, 12, 7, .90);
      box-shadow: 0 0 35px rgba(57,255,136,.12), inset 0 0 22px rgba(57,255,136,.035);
    }
    .tag { color: var(--green); font: 700 12px/1.5 ui-monospace, monospace; letter-spacing: 3px; }
    .digits { color: var(--green); font: 700 clamp(20px, 6vw, 34px)/1.6 ui-monospace, monospace; letter-spacing: 5px; text-shadow: 0 0 12px rgba(57,255,136,.65); margin: 22px 0; }
    h1 { margin: 8px 0 12px; font-size: clamp(25px, 6vw, 36px); color: var(--green); text-shadow: 0 0 14px rgba(57,255,136,.45); }
    p { color: var(--muted); line-height: 1.8; margin: 0 auto 16px; }
    .message {
      margin: 24px 0 8px; padding: 22px 12px; border: 1px dashed var(--green);
      border-radius: 14px; background: rgba(57,255,136,.06);
      animation: pop .7s ease both, glow 2s ease-in-out infinite alternate;
    }
    .message h2 { margin: 0; font-size: clamp(27px, 7vw, 40px); color: var(--green); text-shadow: 0 0 16px rgba(57,255,136,.55); }
    .message p { margin: 12px 0 0; font-size: 14px; }
    .scan { height: 2px; width: 100%; margin: 20px 0; background: linear-gradient(90deg, transparent, var(--green), transparent); opacity: .7; }
    .footer { margin-top: 22px; font-size: 12px; color: #6f907a; }
    @keyframes pop { from { opacity: 0; transform: scale(.82) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes glow { from { box-shadow: 0 0 6px rgba(57,255,136,.08); } to { box-shadow: 0 0 24px rgba(57,255,136,.18); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <main class="card">
    <div class="tag">[ SYSTEM ONLINE ]</div>
    <div class="digits" aria-hidden="true">010101 101010<br>110010 001101</div>
    <h1>أنت مال أمك 😂💚</h1>
    <p>اتقفشت يا نجم 😈</p>
    <div class="scan"></div>
    <section class="message" aria-live="polite">
      <h2>أنت مال أمك 😂</h2>
      <p>والله لقول لجاسر 😂</p>
    </section>
    <div class="footer">NO HACKING • JUST A PRANK 💚</div>
  </main>
  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeMatrix() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const columns = Math.ceil(innerWidth / 18);
      drops = Array.from({length: columns}, () => Math.random() * -innerHeight / 18);
    }
    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 10, 7, 0.12)';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.fillStyle = '#39ff88';
      ctx.font = '15px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(Math.random() > .5 ? '1' : '0', i * 18, drops[i] * 18);
        if (drops[i] * 18 > innerHeight && Math.random() > .975) drops[i] = 0;
        drops[i] += .55 + Math.random() * .55;
      }
      requestAnimationFrame(drawMatrix);
    }
    resizeMatrix();
    window.addEventListener('resize', resizeMatrix);
    drawMatrix();
  </script>
</body>
</html>
